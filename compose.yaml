services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: geopulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-geopulse-local}
      POSTGRES_DB: geopulse
    volumes:
      - geopulse_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geopulse -d geopulse"]
      interval: 3s
      timeout: 3s
      retries: 20
  import:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: &database-env
      DATABASE_URL: postgresql://geopulse:${POSTGRES_PASSWORD:-geopulse-local}@db:5432/geopulse
    command: ["python", "-m", "backend.import_snapshot"]
    depends_on:
      db:
        condition: service_healthy
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      <<: *database-env
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    depends_on:
      import:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"
volumes:
  geopulse_data:
